name: ComandaPro CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Evito que varias compilaciones costosas se ejecuten a la vez sobre main.
concurrency:
  group: comandapro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: FastAPI — tests and image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit and API integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-ci-only-12345
        run: pytest -q
      - name: Build backend image
        run: docker build -t comandapro-api:ci ./backend

  frontend-tests:
    name: React — unit tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Build React frontend
        working-directory: frontend
        run: npm run build
      - name: Build frontend image
        run: docker build -t comandapro-web:ci ./frontend

  compose-smoke-test:
    name: Docker Compose — integration smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure non-production test secrets
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for API and web
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "API y frontend saludables"
              exit 0
            fi
            sleep 3
          done
          docker compose ps -a
          docker compose logs api web db
          exit 1
      - name: Check metrics endpoint
        run: docker compose exec -T api python -c "import urllib.request; assert b'comandapro_http_requests_total' in urllib.request.urlopen('http://127.0.0.1:8000/metrics').read()"
      - name: Verify cAdvisor metrics and Prometheus targets
        shell: bash
        run: |
          docker compose exec -T api python -c "import urllib.request; response = urllib.request.urlopen('http://cadvisor:8080/metrics', timeout=10).read(); assert b'container_cpu_usage_seconds_total' in response, 'cAdvisor missing container CPU metrics'"
          for attempt in {1..20}; do
            if curl -fsS 'http://127.0.0.1:9090/api/v1/targets?state=active' | python -c 'import json,sys; data=json.load(sys.stdin); targets={t["labels"].get("job"):t["health"] for t in data["data"]["activeTargets"]}; sys.exit(0 if targets.get("comandapro-api")=="up" and targets.get("comandapro-contenedores")=="up" else 1)'; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs cadvisor prometheus
          exit 1
      - name: Show stack status
        if: always()
        run: docker compose ps -a
      - name: Stop test stack
        if: always()
        run: docker compose down

  publish-images:
    name: Publish images to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, compose-smoke-test]
    permissions:
      contents: read
      packages: write
    outputs:
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detectar cambios en imagenes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Los Dockerfiles solo dependen del backend y frontend.
          # Una actualizacion de README/capturas no necesita publicar imagenes.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BEFORE"
          if git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^(backend/|frontend/)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios de backend/frontend; omito compilacion y publicacion en GHCR."
          fi
      - name: Normalize image owner
        if: steps.changes.outputs.publish == 'true'
        id: owner
        run: echo "owner_lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU for ARM64 image builds
        if: steps.changes.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.changes.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.changes.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish FastAPI image
        if: steps.changes.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/comandapro-api:latest
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/comandapro-api:${{ github.sha }}
      - name: Build and publish React/Nginx image
        if: steps.changes.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/comandapro-web:latest
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/comandapro-web:${{ github.sha }}

  deploy-remote:
    name: Optional remote deployment via SSH
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_REMOTE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: [publish-images]
    steps:
      - name: Pull and restart the stack on the configured host
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,GHCR_USER,GHCR_PULL_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            git pull --ff-only origin main
            docker compose pull api web
            docker compose up -d --no-build --remove-orphans
            docker compose ps -a
